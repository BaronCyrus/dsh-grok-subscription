name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Require an npm CLI that can use trusted publishing
        run: |
          node <<'EOF'
          const { execSync } = require('node:child_process')
          const version = () => execSync('npm --version', { encoding: 'utf8' }).trim()
          const supports = value => {
            const [major, minor, patch] = value.split('.').map(Number)
            return major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
          }
          if (!supports(version())) {
            execSync('npm install -g npm@11', { stdio: 'inherit' })
          }
          const current = version()
          if (!supports(current)) {
            console.error(`npm ${current} cannot publish with a trusted publisher`)
            process.exit(1)
          }
          console.log(`npm ${current}`)
          EOF
      - name: Install locked dependencies
        run: npm ci
      - name: Refuse a tag that does not match package.json
        run: |
          node <<'EOF'
          const version = require('./package.json').version
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '')
          if (version !== tag) {
            console.error(`tag v${tag} does not match package.json ${version}`)
            process.exit(1)
          }
          EOF
      - name: Test
        run: npm test
      - name: Verify committed lib/ matches a fresh build of src/
        run: git diff --exit-code -- lib
      - name: Publish
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "GitHub did not provide an OIDC token request URL"
            exit 1
          fi
          # Do not set NODE_AUTH_TOKEN at all, even to an empty string.
          # npm treats a present token variable as token auth and skips OIDC.
          unset NODE_AUTH_TOKEN
          npm publish --loglevel verbose
