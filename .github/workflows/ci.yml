name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run the test suite
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify committed lib/ matches a fresh build of src/
        run: git diff --exit-code -- lib
      - name: Verify the package packs
        run: npm pack --dry-run
